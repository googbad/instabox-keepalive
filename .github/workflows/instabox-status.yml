name: InstaBox Read-only Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: read

concurrency:
  group: instabox-read-only-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Monitor InstaBox
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          STATUS_OUTPUT: machines-status.json
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: python3 scripts/status_monitor.py
