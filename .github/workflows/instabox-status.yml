name: InstaBox Read-only Status

on:
  workflow_dispatch:
  schedule:
    - cron: "0,30 * * * *"

permissions: {}

concurrency:
  group: instabox-read-only-status
  cancel-in-progress: false

jobs:
  check-status:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Query and summarize InstaBox machine status
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          STATUS_OUTPUT: machines-status.json
        run: python3 scripts/status_monitor.py
